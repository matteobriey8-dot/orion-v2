services:
  # ── Backend Node.js ──────────────────────────────────────────────────────────
  - type: web
    name: orion-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false          # à remplir manuellement dans le dashboard Render
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: MONGO_URI
        sync: false          # à remplir manuellement
      - key: JWT_SECRET
        sync: false          # à remplir manuellement
      - key: ALLOWED_ORIGINS
        sync: false          # mettre l'URL du frontend Render

  # ── Frontend React ───────────────────────────────────────────────────────────
  - type: web
    name: orion-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        sync: false          # mettre l'URL du backend Render + /api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
